[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "plastburstalign"
description = "A Python tool to extract and align genes, introns, and intergenic spacers across hundreds of plastid genomes using associative arrays"
authors = [
    {name = "Thanina Hamitouche", email = "t_hamitouche@mail.fhsu.edu"},
    {name = "Michael Gruenstaeudl, PhD", email = "m_gruenstaeudl@fhsu.edu"}
]
version = "1.3"

requires-python = ">=3.11"
dependencies = [
    "biopython>=1.85",
    "coloredlogs>=15.0",
    "psutil>=5.9",
    "requests>=2.32",
    "pyyaml>=6.0.2",
]

readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",

    "License :: OSI Approved :: BSD License",

    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
    "bioinformatics",
    "alignment",
    "flatfile",
    "plastid genome",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["plastburstalign"]

[project.scripts]
plastburstalign = "plastburstalign.__main__:main"

[project.urls]
Homepage = "https://gruenstaeudl-lab.com/"
Repository = "https://github.com/michaelgruenstaeudl/PlastBurstAlign"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
    "benchmarking/legacyversions",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes (catches undefined variables, unused imports)
    "I",  # isort (clean, standardized import order)
]
ignore = [
    "BLE001",
    "E501", # Shebang on non-executable files (common in git checkouts)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "SIM117", # Nested with statements (standard for subTest + assertRaises)
]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -p no:cov"

[tool.coverage.run]
source = ["plastburstalign"]
omit = ["tests/*", "benchmarking/*"]

[tool.coverage.report]
show_missing = true
